<!-- LOGOUT MODAL -->
<div class="overlay" id="modal-logout">
  <div class="modal">
    <div class="modal-head">
      <h3 class="modal-title">Đăng xuất</h3>
      <button class="modal-close" id="logout-close">✕</button>
    </div>
    <div class="modal-body">
      <p id="logout-msg" style="font-size:14px;color:var(--muted)"></p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline btn-sm" id="logout-cancel">Hủy</button>
      <button class="btn btn-danger btn-sm" id="logout-confirm-btn">Đăng xuất</button>
    </div>
  </div>
</div>

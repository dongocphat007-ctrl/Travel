      <h3 class="modal-title" id="mc-title">Xác nhận</h3>
      <button class="modal-close" id="mc-close">✕</button>

    <div class="modal-body"><p id="mc-msg" style="font-size:14px;color:var(--muted)"></p></div>

      <button class="btn btn-danger btn-sm" id="mc-ok">🗑️ Xóa</button>
    </div>
  </div>
</div>

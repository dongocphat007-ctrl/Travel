name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build + test (không cần khóa thật: mọi test chạy trên thư mục JSON tạm, không gọi mạng)
        working-directory: backend
        run: mvn -B verify
      - name: Kiểm tra cú pháp JS frontend
        run: |
          for f in frontend/js/*.js; do node --check "$f" || exit 1; done
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # quét CẢ lịch sử git, không chỉ commit mới nhất
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

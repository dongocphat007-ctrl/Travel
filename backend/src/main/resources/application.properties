# Nạp .env (dạng KEY=VALUE) nếu có, không có cũng không lỗi (hỗ trợ cả chạy từ thư mục gốc hoặc backend)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]

# Chỉ tham số KHÔNG bí mật. Secret nằm trong biến môi trường / file .env (xem .env.example).
spring.application.name=travel
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ── Spring Mail (Gmail SMTP) ──
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

# Thư mục frontend (chạy từ backend/, frontend nằm ở ../frontend)
travel.web-root=${WEB_ROOT:../frontend}
# Dữ liệu riêng tư (accounts, bookings, vouchers, payments...) — NGOÀI thư mục tĩnh công khai
travel.db-dir=${DB_DIR:storage/db}
travel.site-url=${SITE_URL:}
travel.trust-proxy=${TRUST_PROXY:false}

# Google Sign-In: Client ID là giá trị CÔNG KHAI (đã nằm trong trang đăng nhập), không phải secret
travel.google-client-id=${GOOGLE_CLIENT_ID:480770803476-s834au6ab8go1uasl0cm7akar6ge8n1e.apps.googleusercontent.com}
travel.gemini-model=${GEMINI_MODEL:gemini-1.5-flash}
travel.email-api-url=${EMAIL_API_URL:https://api.resend.com/emails}
travel.payment-prefix=${PAYMENT_PREFIX:TRAVEL}
# Khóa Google Maps JS (chạy ở trình duyệt nên BẮT BUỘC giới hạn HTTP referrer trong Google Cloud Console)
travel.google-maps-api-key=${GOOGLE_MAPS_API_KEY:}
travel.otp-dev-log=${OTP_DEV_LOG:false}
# Dữ liệu MẪU (tour mẫu trong frontend/data, lượt dùng/đánh giá mẫu, HDV demo, banner mẫu). false = chỉ hiển thị dữ liệu thật (dùng khi chạy thật).
# Đọc qua Spring nên nhận cả giá trị trong file .env (System.getenv không đọc được .env). Chấp nhận true/false/1/0.
travel.sample-data=${SAMPLE_DATA:true}
# Chỉ ẩn riêng review mẫu (khi vẫn muốn giữ các dữ liệu mẫu khác)
travel.hide-sample-reviews=${HIDE_SAMPLE_REVIEWS:false}

# ── SECRET / thông tin riêng: CHỈ đọc từ biến môi trường, không có giá trị mặc định ──
travel.admin-email=${ADMIN_EMAIL:}
travel.admin-password=${ADMIN_PASSWORD:}
travel.session-secret=${SESSION_SECRET:}
travel.gemini-api-key=${GEMINI_API_KEY:}
travel.langfuse-public-key=${LANGFUSE_PUBLIC_KEY:}
travel.langfuse-secret-key=${LANGFUSE_SECRET_KEY:}
travel.langfuse-base-url=${LANGFUSE_BASE_URL:https://cloud.langfuse.com}
travel.email-api-key=${EMAIL_API_KEY:}
travel.email-from=${EMAIL_FROM:}
travel.payment-webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
travel.payment-bank=${PAYMENT_BANK:}
travel.payment-account=${PAYMENT_ACCOUNT:}
travel.payment-account-name=${PAYMENT_ACCOUNT_NAME:}

# ── Nguồn dữ liệu TRỰC TUYẾN cho chuyến bay / khách sạn (đã thiết lập sẵn, chỉ cần điền 3 khóa trong .env) ──
# Chuyến bay: Ignav (giá + liên kết đặt vé của hãng). Khóa trống → dùng danh mục có sẵn.
travel.live.ignav-api-key=${IGNAV_API_KEY:}
travel.live.ignav-base-url=${IGNAV_BASE_URL:https://ignav.com}
# Thị trường tính giá của Ignav (mã quốc gia 2 chữ, quyết định đơn vị tiền). Nếu VN chưa được hỗ trợ hãy thử US.
travel.live.ignav-market=${IGNAV_MARKET:VN}
# Khách sạn: Google Places (danh sách, ảnh, đánh giá) + Travelpayouts/Hotellook (giá, liên kết đặt, có Agoda).
travel.live.google-places-api-key=${GOOGLE_PLACES_API_KEY:}
travel.live.travelpayouts-token=${TRAVELPAYOUTS_TOKEN:}
travel.live.travelpayouts-marker=${TRAVELPAYOUTS_MARKER:}
travel.live.travelpayouts-base-url=${TRAVELPAYOUTS_BASE_URL:https://engine.hotellook.com/api/v2/cache.json}
travel.live.hotel-currency=${HOTEL_CURRENCY:vnd}
# Mẫu liên kết đặt phòng; để trống = dùng mẫu Hotellook có sẵn. Biến: {hotelId} {checkIn} {checkOut} {guests} {currency} {marker} {name}
travel.live.hotel-link-template=${HOTEL_LINK_TEMPLATE:}
# Nhớ kết quả trong RAM bao nhiêu giây (tiết kiệm hạn mức API). 0 = tắt
travel.live.cache-seconds=${LIVE_CACHE_SECONDS:600}
